[project]
name = "next-level-personal-coach-for-career-level"
version = "0.1.0"
description = "Single-user career assessment coach"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "openai>=2,<3", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
career-coach = "career_coach.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/career_coach"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
